name: Build Wi-Fi Visualizer for macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify dashboard
        run: |
          python -m py_compile dashboard.py

      - name: Build application
        run: |
          rm -rf build dist package release
          mkdir -p package release

          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Wi-Fi Visualizer" \
            dashboard.py

      - name: Make app request administrator permission
        run: |
          APP="dist/Wi-Fi Visualizer.app"
          MACOS="$APP/Contents/MacOS"

          mv "$MACOS/Wi-Fi Visualizer" \
             "$MACOS/Wi-Fi Visualizer-bin"

          cat > "$MACOS/Wi-Fi Visualizer" <<'EOF'
          #!/bin/bash

          APP_DIR="$(cd "$(dirname "$0")/.." && pwd)"
          BIN="$APP_DIR/MacOS/Wi-Fi Visualizer-bin"

          BIN_ESCAPED=$(printf '%s' "$BIN" | sed 's/\\/\\\\/g; s/"/\\"/g')

          /usr/bin/osascript \
            -e "do shell script \"exec \\\"$BIN_ESCAPED\\\"\" with administrator privileges"
          EOF

          chmod +x "$MACOS/Wi-Fi Visualizer"

          cp -R "$APP" "package/Wi-Fi Visualizer.app"

      - name: Create launcher
        run: |
          cat > "package/Wi-Fi Visualizer.command" <<'EOF'
          #!/bin/bash

          cd "$(dirname "$0")" || exit 1

          sudo -v || exit 1

          sudo "./Wi-Fi Visualizer.app/Contents/MacOS/Wi-Fi Visualizer-bin"
          EOF

          chmod +x "package/Wi-Fi Visualizer.command"

      - name: Create README
        run: |
          cat > "package/README.txt" <<'EOF'
          Wi-Fi Visualizer
          =================

          Double-click "Wi-Fi Visualizer.app" to launch.

          macOS will request administrator permission because
          Wi-Fi Visualizer requires access to network information.

          Alternative:
          "Wi-Fi Visualizer.command" can be used from Terminal.

          Architecture builds:
          - Apple Silicon (arm64)
          - Intel (x86_64)
          EOF

      - name: Verify application
        run: |
          test -d "package/Wi-Fi Visualizer.app"
          test -x "package/Wi-Fi Visualizer.app/Contents/MacOS/Wi-Fi Visualizer"
          test -x "package/Wi-Fi Visualizer.app/Contents/MacOS/Wi-Fi Visualizer-bin"
          test -x "package/Wi-Fi Visualizer.command"

      - name: Package
        run: |
          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "package" \
            "release/WiFi-Visualizer-macOS-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Visualizer-${{ matrix.arch }}
          path: release/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*.zip
