name: Build Wi-Fi Visualizer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build app
        run: |
          rm -rf build dist
          pyinstaller --noconfirm --clean --windowed \
            --name "Wi-Fi Visualizer" dashboard.py

      - name: Create launcher
        run: |
          mkdir -p package
          cp -R "dist/Wi-Fi Visualizer.app" package/

          printf '%s\n' \
            '#!/bin/bash' \
            'cd "$(dirname "$0")" || exit 1' \
            'sudo "./Wi-Fi Visualizer.app/Contents/MacOS/Wi-Fi Visualizer"' \
            > "package/Wi-Fi Visualizer.command"

          chmod +x "package/Wi-Fi Visualizer.command"

          echo "=== LAUNCHER ==="
          cat "package/Wi-Fi Visualizer.command"

          echo "=== APP EXECUTABLE ==="
          ls -l "package/Wi-Fi Visualizer.app/Contents/MacOS/Wi-Fi Visualizer"

      - name: Package
        run: |
          mkdir release
          ditto -c -k --sequesterRsrc --keepParent \
            "package" \
            "release/WiFi-Visualizer-macOS-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Visualizer-${{ matrix.arch }}
          path: release/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*.zip
