name: Build Wi-Fi Visualizer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14

          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application
        run: |
          rm -rf build dist package release
          mkdir -p package release

          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Wi-Fi Visualizer" \
            dashboard.py

      - name: Create working launcher
        run: |
          cp -R "dist/Wi-Fi Visualizer.app" "package/Wi-Fi Visualizer.app"

          cat > "package/Wi-Fi Visualizer.command" <<'EOF'
          #!/bin/bash

          cd "$(dirname "$0")" || exit 1

          echo "======================================"
          echo "       Wi-Fi Visualizer"
          echo "======================================"
          echo ""
          echo "Administrator permission is required"
          echo "to read macOS Wi-Fi information."
          echo ""

          sudo -v || exit 1

          sudo "./Wi-Fi Visualizer.app/Contents/MacOS/Wi-Fi Visualizer"

          echo ""
          echo "Wi-Fi Visualizer closed."
          read -p "Press Enter to close..."
          EOF

          chmod +x "package/Wi-Fi Visualizer.command"

      - name: Create instructions
        run: |
          cat > "package/README.txt" <<'EOF'
          WI-FI VISUALIZER
          =================

          IMPORTANT:
          Do NOT double-click "Wi-Fi Visualizer.app".

          macOS requires administrator permission for Wi-Fi
          signal information.

          To start the application:

          1. Double-click:
             Wi-Fi Visualizer.command

          2. Enter your Mac password when Terminal asks.

          3. The Wi-Fi Visualizer dashboard will open.

          Apple Silicon Macs:
          Use the arm64 download.

          Intel Macs:
          Use the x86_64 download.
          EOF

      - name: Verify package
        run: |
          test -d "package/Wi-Fi Visualizer.app"
          test -x "package/Wi-Fi Visualizer.command"
          test -f "package/README.txt"
          test -x "package/Wi-Fi Visualizer.app/Contents/MacOS/Wi-Fi Visualizer"

          echo "=== PACKAGE ==="
          find package -maxdepth 3 -print

          echo "=== LAUNCHER ==="
          cat "package/Wi-Fi Visualizer.command"

      - name: Package
        run: |
          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "package" \
            "release/WiFi-Visualizer-macOS-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Visualizer-${{ matrix.arch }}
          path: release/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*.zip
