name: Build Wi-Fi Visualizer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS app
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python application
        run: |
          rm -rf build dist
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Wi-Fi Visualizer" \
            dashboard.py

      - name: Create administrator launcher app
        run: |
          rm -rf "Wi-Fi Visualizer Launcher.app"

          cat > launcher.applescript <<'APPLESCRIPT'
          set appPath to (POSIX path of (path to me)) & "Contents/Resources/Wi-Fi Visualizer.app/Contents/MacOS/Wi-Fi Visualizer"
          do shell script quoted form of appPath with administrator privileges
          APPLESCRIPT

          osacompile \
            -o "Wi-Fi Visualizer Launcher.app" \
            launcher.applescript

          mkdir -p "Wi-Fi Visualizer Launcher.app/Contents/Resources"

          cp -R \
            "dist/Wi-Fi Visualizer.app" \
            "Wi-Fi Visualizer Launcher.app/Contents/Resources/"

      - name: Rename launcher
        run: |
          mv \
            "Wi-Fi Visualizer Launcher.app" \
            "dist/Wi-Fi Visualizer.app"

      - name: Create ZIP
        run: |
          cd dist
          zip -r "../WiFi-Visualizer-macOS-${{ matrix.arch }}.zip" \
            "Wi-Fi Visualizer.app"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Visualizer-macOS-${{ matrix.arch }}
          path: WiFi-Visualizer-macOS-${{ matrix.arch }}.zip

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Download built apps
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*.zip
