name: Build Wi-Fi Visualizer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}

    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application
        run: |
          rm -rf build dist
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Wi-Fi Visualizer" \
            dashboard.py

      - name: Create launcher
        run: |
          cat > "Wi-Fi Visualizer.command" <<'LAUNCHER'
          #!/bin/bash

          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"

          sudo -v || exit 1

          exec sudo "$SCRIPT_DIR/Wi-Fi Visualizer.app/Contents/MacOS/Wi-Fi Visualizer"
          LAUNCHER

          chmod +x "Wi-Fi Visualizer.command"

      - name: Create distribution folder
        run: |
          mkdir -p "Wi-Fi Visualizer"

          cp -R \
            "dist/Wi-Fi Visualizer.app" \
            "Wi-Fi Visualizer/"

          cp \
            "Wi-Fi Visualizer.command" \
            "Wi-Fi Visualizer/"

      - name: Create ZIP
        run: |
          mkdir -p release

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "Wi-Fi Visualizer" \
            "release/WiFi-Visualizer-macOS-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Visualizer-macOS-${{ matrix.arch }}
          path: release/*.zip

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*.zip
