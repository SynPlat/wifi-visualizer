name: Build Wi-Fi Visualizer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build macOS app
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Wi-Fi Visualizer" \
            dashboard.py

      - name: Create ZIP
        run: |
          cd dist
          zip -r "../WiFi-Visualizer-macOS-${{ matrix.arch }}.zip" "Wi-Fi Visualizer.app"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Visualizer-macOS-${{ matrix.arch }}
          path: WiFi-Visualizer-macOS-${{ matrix.arch }}.zip
