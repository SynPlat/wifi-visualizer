name: Build Wi-Fi Visualizer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}

    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build PyInstaller application
        run: |
          rm -rf build dist

          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Wi-Fi Visualizer" \
            dashboard.py

      - name: Create final application bundle
        run: |
          mkdir -p "Wi-Fi Visualizer.app/Contents/MacOS"
          mkdir -p "Wi-Fi Visualizer.app/Contents/Resources/WiFiVisualizerRuntime"

          cp -R \
            "dist/Wi-Fi Visualizer.app/Contents/Frameworks" \
            "Wi-Fi Visualizer.app/Contents/Resources/WiFiVisualizerRuntime/"

          cp -R \
            "dist/Wi-Fi Visualizer.app/Contents/Resources" \
            "Wi-Fi Visualizer.app/Contents/Resources/WiFiVisualizerRuntime/"

          cp \
            "dist/Wi-Fi Visualizer.app/Contents/MacOS/Wi-Fi Visualizer" \
            "Wi-Fi Visualizer.app/Contents/Resources/WiFiVisualizerRuntime/"

      - name: Create launcher
        run: |
          cat > "Wi-Fi Visualizer.app/Contents/MacOS/WiFiVisualizerLauncher" <<'LAUNCHER'
          #!/bin/bash

          APP_ROOT="$(cd "$(dirname "$0")/.." && pwd)"
          EXECUTABLE="$APP_ROOT/Resources/WiFiVisualizerRuntime/Wi-Fi Visualizer"

          /usr/bin/osascript \
            -e "do shell script quoted form of \"$EXECUTABLE\" with administrator privileges"
          LAUNCHER

          chmod +x \
            "Wi-Fi Visualizer.app/Contents/MacOS/WiFiVisualizerLauncher"

      - name: Create Info.plist
        run: |
          cat > "Wi-Fi Visualizer.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Wi-Fi Visualizer</string>

              <key>CFBundleExecutable</key>
              <string>WiFiVisualizerLauncher</string>

              <key>CFBundleIdentifier</key>
              <string>com.synplat.wifivisualizer</string>

              <key>CFBundleName</key>
              <string>Wi-Fi Visualizer</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>
          </dict>
          </plist>
          PLIST

      - name: Verify bundle
        run: |
          echo "Checking application:"
          find "Wi-Fi Visualizer.app/Contents" -maxdepth 3 -print

          echo ""
          echo "Checking launcher:"
          file "Wi-Fi Visualizer.app/Contents/MacOS/WiFiVisualizerLauncher"

          echo ""
          echo "Checking executable:"
          file "Wi-Fi Visualizer.app/Contents/Resources/WiFiVisualizerRuntime/Wi-Fi Visualizer"

      - name: Create ZIP
        run: |
          mkdir -p release

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "Wi-Fi Visualizer.app" \
            "release/WiFi-Visualizer-macOS-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Visualizer-macOS-${{ matrix.arch }}
          path: release/WiFi-Visualizer-macOS-${{ matrix.arch }}.zip

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*.zip
